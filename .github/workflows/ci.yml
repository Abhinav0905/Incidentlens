name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System deps (ffmpeg, cairo, espeak for studio render tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libcairo2 espeak-ng

      - name: Install
        run: pip install -e ".[dev,genblaze]"

      - name: Lint
        run: ruff check .

      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy src

      - name: Test
        run: pytest --cov=incidentlens --cov-report=term-missing
