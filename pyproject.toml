[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentlens"
version = "0.6.0"
description = "Evidence-backed incident reconstruction for distributed systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Kumar Abhinav"}
]
keywords = ["incident-response", "observability", "sre", "root-cause-analysis", "aiops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.9,<3.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
# Richer structural analysis (cycles, blast radius). Optional: code_graph
# falls back to a pure-Python Tarjan/BFS when networkx is absent.
graph = [
  "networkx>=3.0",
]
# The hosted service needs exactly one model client, for the "describe an
# incident" sandbox. Kept separate from `studio` so the deploy image stays small:
# no numpy, no cairo, no ffmpeg.
sandbox = [
  "openai>=2.0,<3.0",
]
studio = [
  "numpy>=1.26",
  "Pillow>=10.3",
  "cairosvg>=2.7,<3.0",
  "anthropic>=0.40",
  "openai>=2.0,<3.0",
  "boto3>=1.34",
  "requests>=2.31,<3.0",
  "networkx>=3.0",
]
genblaze = [
  "genblaze-core[audio]>=0.3.7,<0.4; python_version >= '3.11'",
  "genblaze-openai>=0.3.3,<0.4; python_version >= '3.11'",
  "genblaze-s3>=0.3.6,<0.4; python_version >= '3.11'",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.1,<7.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.11,<1.0",
  "mypy>=1.15,<2.0",
  "numpy>=1.26",
  "Pillow>=10.3",
  "cairosvg>=2.7,<3.0",
  "anthropic>=0.40",
  "openai>=2.0,<3.0",
  "boto3>=1.34",
  "requests>=2.31,<3.0",
  "networkx>=3.0",
]

[project.scripts]
incidentlens = "incidentlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
incidentlens = [
  "static/*",
  "data/scenarios/*/*.json",
  "studio/cinema/assets/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# the embedded HTML/JS template favors compactness over line length
"src/incidentlens/studio/graphview.py" = ["E501"]

[tool.mypy]
# 3.12, not 3.11: numpy >= 2.3 ships stubs written with PEP 695 `type` statements,
# and targeting 3.11 made mypy reject them as a syntax error inside a dependency —
# which aborted the run before any of our own code was checked, so CI was red while
# telling us nothing. The package still supports 3.11 at runtime; only the type
# target moved.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# Strict everywhere except the renderer and the CLI, which predate the type gate
# and are being annotated incrementally. Listing them here rather than excluding
# them keeps them checked for real errors — only the "everything must be annotated"
# rules are relaxed, so the gate stays meaningful and the backlog stays visible.
[[tool.mypy.overrides]]
module = [
  "incidentlens.cli",
  "incidentlens.live",
  "incidentlens.connectors.internals_scan",
  "incidentlens.connectors.synthetic",
  "incidentlens.engines.internal_trace",
  "incidentlens.studio.render",
  "incidentlens.studio.graphview",
  "incidentlens.studio.cinema.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false

# Known typing debt in the renderer, listed by code so it stays visible:
#   attr-defined  Pillow moved Image.LANCZOS to Image.Resampling.LANCZOS
#   index         tuple(sorted(pair)) widens to tuple[str, ...] against a
#                 dict[tuple[str, str], float] key
#   arg-type      the font loader returns object rather than a Pillow font union
# The renderer is covered by pixel-level tests, so these are scheduled rather than
# rushed. Everything outside this list is checked strictly.
[[tool.mypy.overrides]]
module = ["incidentlens.studio.cinema.*"]
disable_error_code = ["attr-defined", "index", "arg-type"]
