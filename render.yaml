# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# New -> Blueprint -> pick the repo. Render reads this file, builds the
# Dockerfile, and gives you an HTTPS URL such as
# https://incidentlens.onrender.com
#
# The `starter` plan is deliberate. On the free plan Render spins the service
# down after ~15 minutes idle and the next request pays a ~50 second cold
# start — which is exactly what a hackathon judge would experience clicking a
# link from a submission page. Starter keeps it warm.

services:
  - type: web
    name: incidentlens
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: INCIDENTLENS_ENV
        value: production
      - key: INCIDENTLENS_LOG_LEVEL
        value: INFO

      # Optional. Enables the "describe an incident" sandbox, where a visitor's
      # prompt is turned into structured telemetry the engine then reconstructs.
      # sync:false means this blueprint carries NO value — Render prompts for it
      # and stores it encrypted. It must never be committed.
      #
      # Leave it unset and the sandbox reports itself disabled; pasting real log
      # lines still works, because that path needs no model at all.
      - key: OPENAI_API_KEY
        sync: false

      # Spend guards for that endpoint. It is public, so it is rate limited and
      # capped; raise these only if you are watching the bill.
      - key: INCIDENTLENS_SANDBOX_DAILY_LIMIT
        value: "200"
      - key: INCIDENTLENS_SANDBOX_PER_IP_PER_HOUR
        value: "10"

      # No Backblaze credentials are needed: incident media and its Genblaze
      # manifests are served straight from the public B2 bucket, and rendering
      # happens offline.
